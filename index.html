<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>HardBid Consulting | Website Under Development</title>
  <meta name="description" content="The HardBid Consulting website is currently under development." />
  <style>
    :root {
      color-scheme: dark;
      --navy: #05080f;
      --panel: rgba(12, 19, 32, 0.86);
      --line: rgba(231, 167, 57, 0.28);
      --ink: #edf2f8;
      --muted: #aeb8c8;
      --gold: #e7a739;
      --gold-light: #f4c467;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 12%, rgba(231, 167, 57, 0.11), transparent 34rem),
        radial-gradient(circle at 8% 92%, rgba(45, 77, 126, 0.17), transparent 38rem),
        linear-gradient(155deg, #080e1b 0%, var(--navy) 68%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "UNDER DEVELOPMENT";
      position: fixed;
      left: 50%;
      top: 50%;
      width: 150vw;
      transform: translate(-50%, -50%) rotate(-14deg);
      color: rgba(255, 255, 255, 0.025);
      font-size: clamp(4.5rem, 14vw, 13rem);
      font-weight: 900;
      letter-spacing: 0.06em;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 36px));
      padding: clamp(34px, 7vw, 64px);
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 34px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(18px);
    }

    .mark {
      display: block;
      width: 116px;
      height: 116px;
      margin: 0 auto 18px;
      object-fit: contain;
      filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45));
    }

    .brand {
      margin: 0 0 26px;
      color: var(--gold-light);
      font-size: 0.78rem;
      font-weight: 750;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.15rem, 7vw, 4.25rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .rule {
      width: 66px;
      height: 2px;
      margin: 27px auto;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    p {
      max-width: 520px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.08rem);
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      color: #cbd3df;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 5px rgba(231, 167, 57, 0.12);
    }

    footer {
      position: fixed;
      z-index: 1;
      bottom: 18px;
      left: 18px;
      right: 18px;
      color: rgba(174, 184, 200, 0.62);
      font-size: 0.75rem;
      text-align: center;
    }

    @media (max-height: 680px) {
      main { padding-top: 26px; padding-bottom: 26px; }
      .mark { width: 78px; height: 78px; margin-bottom: 10px; }
      .brand { margin-bottom: 16px; }
      .rule { margin-top: 18px; margin-bottom: 18px; }
      .status { margin-top: 20px; }
      footer { position: static; margin-top: 20px; }
      body { padding: 18px 0; overflow: auto; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="page-title">
    <img class="mark" src="assets/lion.png" alt="HardBid Consulting lion mark" />
    <p class="brand">HardBid Consulting</p>
    <h1 id="page-title">Website Under Development</h1>
    <hr class="rule" />
    <p>We’re refining our online presence. This website is temporarily limited while updates are underway.</p>
    <div class="status" aria-label="Temporary website status">Updates in progress</div>
  </main>
  <footer>&copy; 2026 HardBid Consulting</footer>
</body>
</html>
